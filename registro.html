<main class="container my-4">
    <h1 class="mb-4">Registro de Usuario</h1>

    <div class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
    <form action="registro.html" method="get">
        <div class="mb-3">
        <label for="reg_nombre" class="form-label">Nombre de usuario:</label>
        <input type="text" id="reg_nombre" name="usuario" class="form-control" required>
        </div>
        <div class="mb-3">
        <label for="reg_email" class="form-label">Correo electrónico:</label>
        <input type="email" id="reg_email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
        <label for="reg_clave" class="form-label">Contraseña:</label>
        <input type="password" id="reg_clave" name="clave" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Crear Cuenta</button>
    </form>
    </div>
</main>
